<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="粮见">
<meta name="theme-color" content="#f4f6f5">
<title>粮见</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f4f6f5; --card: #ffffff; --soft: #f5f7f6; --line: #e8ecea; --fg: #17201b; --mut: #6b7570; --mut2: #9aa29e;
    --green: #1f7a4c; --green2: #2e9a5f; --greenbg: #e6f3eb; --orange: #f08c00; --orangebg: #fff5e6; --red: #e5484d; --redbg: #fdecec;
    --shadow: 0 1px 2px rgba(16,40,28,.04), 0 6px 20px rgba(16,40,28,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1210; --card: #171d1a; --soft: #1e2521; --line: #27302b; --fg: #edf2ef; --mut: #9aa6a0; --mut2: #6e7a74;
      --green: #3fb77a; --green2: #3fb77a; --greenbg: #18301f; --orange: #ffa94d; --orangebg: #2e2414; --red: #ff6b6b; --redbg: #331a1b; --shadow: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font: 16px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
         -webkit-font-smoothing: antialiased; padding-bottom: calc(88px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; cursor: pointer; }
  main { max-width: 560px; margin: 0 auto; padding: calc(10px + env(safe-area-inset-top)) 16px 24px; }

  header { display: flex; align-items: center; gap: 6px; padding: 6px 2px 14px; }
  .brand { display: flex; align-items: center; gap: 6px; font-size: 24px; font-weight: 800; letter-spacing: .02em; margin-right: auto; }
  .brand svg { width: 30px; height: 30px; }
  .picker { border: 0; background: none; font-size: 15px; font-weight: 500; padding: 6px 8px; display: flex; align-items: center; gap: 4px; border-radius: 10px; }
  .picker:active { background: var(--line); }
  .chev { width: 14px; height: 14px; }

  .titlebar { display: flex; align-items: flex-start; justify-content: space-between; margin: 0 2px 14px; }
  .title { font-size: 28px; font-weight: 800; letter-spacing: .01em; line-height: 1.25; }
  .subtitle { color: var(--mut); font-size: 15px; margin-top: 2px; }
  .tag { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 500; padding: 4px 12px; border-radius: 999px; background: var(--greenbg); color: var(--green); white-space: nowrap; flex: none; }
  .tag.orange { background: var(--orangebg); color: var(--orange); }
  .tag.gray { background: var(--soft); color: var(--mut); }

  .card { background: var(--card); border-radius: 22px; padding: 18px; box-shadow: var(--shadow); margin-bottom: 14px; }
  .seg { display: flex; gap: 4px; background: var(--card); border-radius: 18px; padding: 5px; box-shadow: var(--shadow); margin-bottom: 14px; }
  .seg button { flex: 1; border: 0; background: var(--soft); border-radius: 14px; padding: 9px; font-size: 16px; color: var(--mut); transition: all .2s; }
  .seg button.on { background: var(--green); color: #fff; font-weight: 600; }
  .seg.small { background: var(--soft); box-shadow: none; margin: 12px 0 0; padding: 3px; border-radius: 12px; }
  .seg.small button { background: none; font-size: 14px; padding: 6px; border-radius: 10px; }
  .seg.small button.on { background: var(--card); color: var(--fg); box-shadow: 0 1px 4px rgba(0,0,0,.08); }

  .headline { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .headline b { font-size: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 800; color: var(--green); letter-spacing: .01em; }
  .headline b.down { color: var(--red); } .headline b.flat { color: var(--fg); }
  .chartbox { height: 190px; margin: 12px -4px 4px; position: relative; }
  .legend { display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--mut); flex-wrap: wrap; }
  .legend i { display: inline-block; width: 22px; border-top: 3px solid var(--green); vertical-align: middle; margin-right: 6px; border-radius: 2px; }
  .legend i.dash { border-top-style: dashed; }
  .legend .note { margin-left: auto; font-size: 12px; color: var(--mut2); }

  h4 { font-size: 19px; font-weight: 700; margin: 20px 0 10px; }
  .factor { display: flex; gap: 14px; margin-bottom: 14px; }
  .dot { width: 36px; height: 36px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font-size: 22px; font-weight: 600; line-height: 1; }
  .dot.plus { background: var(--green2); } .dot.minus { background: #f5a524; } .dot.neutral { background: var(--mut2); }
  .factor b { font-size: 16px; font-weight: 600; } .factor p { margin: 2px 0 0; color: var(--mut); font-size: 14px; line-height: 1.55; }
  .warn { display: flex; gap: 10px; align-items: flex-start; background: var(--orangebg); color: var(--orange); border-radius: 14px; padding: 12px 14px; font-size: 15px; font-weight: 500; }
  .warn .ic { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--orange); color: #fff; display: grid; place-items: center; font-size: 14px; font-weight: 700; margin-top: 1px; }

  .btn { display: block; width: 100%; border: 0; border-radius: 999px; background: var(--green); color: #fff; font-size: 17px; font-weight: 600; padding: 15px; box-shadow: 0 6px 16px rgba(31,122,76,.25); transition: transform .12s, opacity .2s; }
  .btn:active { transform: scale(.98); } .btn:disabled { opacity: .5; }
  .link { display: block; text-align: center; color: var(--green); font-weight: 600; font-size: 15px; margin: 14px 0 4px; border: 0; background: none; width: 100%; }

  .stats { display: flex; padding: 14px 0; }
  .stats div { flex: 1; text-align: center; } .stats div + div { border-left: 1px solid var(--line); }
  .stats b { display: block; font-size: 32px; font-weight: 700; color: var(--green); line-height: 1.2; }
  .stats div + div b { color: var(--mut); }
  .stats span { color: var(--mut); font-size: 15px; }
  .chips { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { border: 0; flex: none; padding: 8px 16px; border-radius: 999px; background: var(--card); color: var(--fg); font-size: 15px; box-shadow: var(--shadow); }
  .chips button.on { background: var(--green); color: #fff; font-weight: 600; }
  .rhead { display: flex; justify-content: space-between; align-items: center; }
  .rhead b { font-size: 18px; font-weight: 700; }
  .cmp { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .cmp .box { flex: 1; background: var(--soft); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; min-width: 0; }
  .cmp .arrow { color: var(--mut2); font-size: 20px; flex: none; }
  .dir { display: flex; align-items: center; gap: 6px; font-size: 18px; font-weight: 700; margin: 2px 0; }
  .dir svg { width: 26px; height: 26px; flex: none; }
  .up { color: var(--green2); } .down { color: var(--red); } .flat { color: var(--mut); }
  .reason { margin-top: 12px; background: var(--orangebg); border-radius: 14px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .reason .t { font-size: 14px; color: var(--mut); } .reason .v { font-size: 15px; }
  .more { color: var(--green); font-weight: 600; font-size: 15px; border: 0; background: none; padding: 0; flex: none; white-space: nowrap; }
  .foot { display: flex; align-items: center; gap: 6px; color: var(--mut); font-size: 13px; margin: 4px 2px 0; }

  .list { background: var(--card); border-radius: 22px; box-shadow: var(--shadow); margin-bottom: 14px; padding: 4px 0; }
  .row { display: flex; align-items: center; gap: 14px; padding: 14px 18px; position: relative; width: 100%; border: 0; background: none; text-align: left; }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 56px; right: 18px; border-top: 1px solid var(--line); }
  .row .ic { width: 26px; height: 26px; flex: none; color: var(--fg); }
  .row .k { flex: 1; font-size: 16px; font-weight: 500; }
  .row .v { color: var(--mut); font-size: 15px; display: flex; align-items: center; gap: 6px; }
  .row .gt { color: var(--mut2); font-size: 20px; margin-left: 4px; }
  .badge-ok, .badge-no { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font-size: 12px; font-weight: 700; }
  .badge-ok { background: var(--green2); } .badge-no { background: #f5a524; }
  .modes { display: flex; gap: 10px; margin: 12px 0 10px; }
  .modes button { flex: 1; border: 1.5px solid var(--line); background: var(--card); border-radius: 14px; padding: 12px; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .modes button.on { background: var(--green); border-color: var(--green); color: #fff; }
  .hint { color: var(--mut); font-size: 13px; }

  .price { font-size: 40px; font-weight: 800; letter-spacing: -.01em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .price small { font-size: 16px; font-weight: 500; color: var(--mut); margin-left: 4px; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .pill.up { background: var(--greenbg); } .pill.down { background: var(--redbg); } .pill.flat { background: var(--soft); }
  .field { display: flex; gap: 10px; margin-top: 10px; }
  .field input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--soft); border-radius: 14px; padding: 12px 14px; font: inherit; color: var(--fg); outline: none; }
  .field input:focus { border-color: var(--green); }
  .field button { flex: none; border: 0; border-radius: 14px; background: var(--green); color: #fff; font-weight: 600; padding: 0 18px; }
  .mini { display: flex; justify-content: space-between; padding: 10px 0; font-size: 15px; border-top: 1px solid var(--line); }
  .mini:first-of-type { border-top: 0; }
  .empty { color: var(--mut); text-align: center; padding: 28px 12px; font-size: 15px; }

  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: color-mix(in srgb, var(--card) 88%, transparent);
        backdrop-filter: saturate(180%) blur(18px); -webkit-backdrop-filter: saturate(180%) blur(18px);
        border-top: 1px solid var(--line); display: flex; justify-content: center; padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); }
  nav button { flex: 1; max-width: 140px; border: 0; background: none; color: var(--mut); font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  nav svg { width: 24px; height: 24px; }
  nav button.on { color: var(--green); font-weight: 600; }
  .page { display: none; } .page.on { display: block; animation: in .25s ease; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .mask { position: fixed; inset: 0; background: rgba(0,0,0,.32); z-index: 30; opacity: 0; pointer-events: none; transition: opacity .25s; }
  .mask.show { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; max-width: 560px; margin: 0 auto; background: var(--card); border-radius: 24px 24px 0 0;
           padding: 8px 18px calc(18px + env(safe-area-inset-bottom)); transform: translateY(105%); visibility: hidden; transition: transform .3s cubic-bezier(.2,.8,.2,1), visibility .3s; max-height: 82vh; overflow-y: auto; }
  .sheet.show { transform: none; visibility: visible; }
  .sheet .grip { width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
  .sheet h3 { margin: 0 0 10px; font-size: 18px; }
  .opt { display: flex; justify-content: space-between; align-items: center; width: 100%; border: 0; background: none; padding: 14px 4px; font-size: 16px; border-bottom: 1px solid var(--line); text-align: left; }
  .opt.on { color: var(--green); font-weight: 600; }
  .sheet p { color: var(--mut); font-size: 15px; margin: 6px 0; }
  .sheet code { background: var(--soft); padding: 1px 6px; border-radius: 6px; font-size: 13px; }

  .toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top)); transform: translate(-50%, -90px); z-index: 40; background: var(--fg); color: var(--bg);
           padding: 10px 18px; border-radius: 999px; font-size: 15px; transition: transform .3s cubic-bezier(.2,.9,.3,1.2); max-width: 90vw; }
  .toast.show { transform: translate(-50%, 0); }
  #login { max-width: 360px; margin: 16vh auto 0; padding: 0 20px; text-align: center; }
  #login .brand { justify-content: center; font-size: 34px; margin: 0 0 6px; }
  #login .brand svg { width: 44px; height: 44px; }
  #login .field input { text-align: center; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="leaf" viewBox="0 0 32 32"><path d="M27 4C14 4 6 10 6 20c0 2.4.7 4.6 1.8 6.3C10 18 16 13 22 10c-5 4-10 9.5-12.6 17.4 1.7 1.1 3.8 1.6 5.6 1.6C25 29 28 18 27 4z" fill="#2e9a5f"/><path d="M4 30c2-9 8-15.5 15-19" stroke="#1f7a4c" stroke-width="2" fill="none" stroke-linecap="round"/></symbol>
  <symbol id="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M3 7l6 6 4-4 8 8M15 17h6v-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-flat" viewBox="0 0 24 24"><path d="M3 12h16M15 8l4 4-4 4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>
<div class="toast" id="toast"></div>
<div class="mask" id="mask" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"><div class="grip"></div><div id="sheetBody"></div></div>

<div id="login" style="display:none">
  <div class="brand"><svg><use href="#leaf"/></svg>粮见</div>
  <p class="subtitle">输入访问密钥</p>
  <form class="field" onsubmit="saveKey(event)"><input id="key" type="password" placeholder="API Key" autocomplete="current-password"><button>进入</button></form>
</div>

<main id="app" style="display:none">
  <header>
    <div class="brand"><svg><use href="#leaf"/></svg>粮见</div>
    <button class="picker" onclick="pickRegion()"><span id="hRegion"></span><svg class="chev"><use href="#chev"/></svg></button>
    <button class="picker" onclick="pickCrop()"><span id="hCrop"></span><svg class="chev"><use href="#chev"/></svg></button>
  </header>

  <!-- 行情 -->
  <section class="page" id="p-market">
    <div class="titlebar"><div><div class="title">今日行情</div><div class="subtitle">本地报价优先，期货作参考。</div></div><span class="tag demoTag">演示预览</span></div>
    <div class="card" id="priceCard"></div>
    <div class="card"><h4 style="margin-top:0">记录本地收购价</h4>
      <form class="field" onsubmit="addPrice(event)"><input id="price" type="number" inputmode="decimal" step="0.001" required><button>保存</button></form>
      <h4>一线见闻</h4>
      <form class="field" onsubmit="addNote(event)"><input id="note" placeholder="如：农户惜售，深加工厂提价2分" required><button>记下</button></form>
      <div id="notes" style="margin-top:8px"></div>
    </div>
    <div class="card"><h4 style="margin-top:0">期货参考</h4><div id="futures"></div></div>
    <div class="card" id="weatherCard"></div>
  </section>

  <!-- 分析 -->
  <section class="page" id="p-analysis">
    <div class="titlebar"><div><div class="title">走势分析</div><div class="subtitle">看清方向，也看见不确定性。</div></div><span class="tag demoTag">演示预览</span></div>
    <div class="seg" id="hz"><button data-h="3">3天</button><button data-h="7" class="on">7天</button></div>
    <div class="card" id="analysisCard"></div>
    <button class="btn" id="genBtn" onclick="genAnalysis()">生成分析</button>
    <button class="link" onclick="go('review')">查看预测记录 ›</button>
  </section>

  <!-- 复盘 -->
  <section class="page" id="p-review">
    <div class="titlebar"><div><div class="title">预测复盘</div><div class="subtitle">每次判断，都留下可追溯的记录。</div></div><span class="tag demoTag">演示预览</span></div>
    <div class="card stats" id="stats"></div>
    <div class="chips" id="chips"><button data-f="all" class="on">全部</button><button data-f="ok">判断一致</button><button data-f="bad">出现偏差</button><button data-f="open">待核验</button></div>
    <div id="reviewList"></div>
    <div class="foot">ⓘ 以同地区、同口径报价核验，不保证预测准确。</div>
    <div class="card" style="margin-top:14px"><h4 style="margin-top:0">经验库</h4><div id="lessons"></div></div>
  </section>

  <!-- 设置 -->
  <section class="page" id="p-settings">
    <div class="titlebar"><div><div class="title">偏好设置</div><div class="subtitle">让分析更贴近你关注的市场。</div></div><span class="tag demoTag">演示预览</span></div>
    <div class="list">
      <button class="row" onclick="pickRegion(true)"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-7-6.1-7-11.5A7 7 0 0119 9.5C19 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
        <span class="k">关注地区</span><span class="v" id="sRegion"></span><span class="gt">›</span></button>
      <button class="row" onclick="pickCrop(true)"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 4c-8 0-13 4-13 10 0 1.6.4 3 1.2 4.2"/><path d="M20 4c0 9-4 15-10 15-1 0-2-.2-2.8-.6"/><path d="M4 21c2.5-5 6-8.5 10-11"/></svg>
        <span class="k">默认品种</span><span class="v" id="sCrop"></span><span class="gt">›</span></button>
      <button class="row" onclick="pickUnit()"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M7 21h10M5 7h14M5 7l-3 7a3 3 0 006 0zM19 7l-3 7a3 3 0 006 0z"/></svg>
        <span class="k">价格单位</span><span class="v" id="sUnit"></span><span class="gt">›</span></button>
    </div>
    <div class="card">
      <div style="display:flex;align-items:center;gap:14px"><svg class="ic" style="width:26px;height:26px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M9 20h6M12 16v4"/></svg><b style="font-weight:500">显示模式</b></div>
      <div class="modes"><button data-m="demo">预览演示</button><button data-m="real">真实数据</button></div>
      <div class="hint">演示数据独立展示，不写入正式记录。</div>
    </div>
    <div class="list" id="statusList"></div>
    <button class="btn" onclick="savePrefs()">保存偏好</button>
  </section>
</main>

<nav id="nav" style="display:none">
  <button data-p="market"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 20V11M12 20V5M18 20v-6"/></svg>行情</button>
  <button data-p="analysis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>分析</button>
  <button data-p="review"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>复盘</button>
  <button data-p="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>设置</button>
</nav>

<script>
/* ---------- 基础 ---------- */
const store = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
let KEY = store.get('grainKey', '');
const S = { meta: null, region: '周口', crop: 'corn', unit: 'jin', horizon: 7, page: store.get('page', 'analysis'),
            mode: store.get('mode', 'real'), filter: 'all', days: 90, reviews: null, status: null };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const CROP = { corn: '玉米', wheat: '小麦' };
const DIR = { up: '上涨', down: '下跌', flat: '持平' };
const SRC = { stat: '统计模型', deepseek: 'DeepSeek' };
const unitTxt = () => S.unit === 'ton' ? '元/吨' : '元/斤';
const conv = p => p == null ? null : (S.unit === 'ton' ? p * 2000 : p);
const fmt = p => p == null ? '—' : (S.unit === 'ton' ? Math.round(p * 2000).toString() : (+p).toFixed(3));
const md = d => d ? d.slice(5).replace('-', '/') : '';
const pill = v => v == null ? '<span class="pill flat">—</span>' : `<span class="pill ${v > 0 ? 'up' : v < 0 ? 'down' : 'flat'}">${v > 0 ? '+' : ''}${v}%</span>`;
const dirIcon = d => `<svg><use href="#i-${d}"/></svg>`;
const isDemo = () => S.mode === 'demo';
let charts = {};

function toast(t) { const e = $('toast'); e.textContent = t; e.classList.add('show'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('show'), 2000); }
async function api(path, body) {
  const r = await fetch(path, { method: body ? 'POST' : 'GET', headers: { 'X-API-Key': KEY, 'Content-Type': 'application/json' }, body: body && JSON.stringify(body) });
  if (r.status === 401) { showLogin(); throw new Error('密钥错误'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || ('请求失败 ' + r.status));
  return j;
}
function showLogin() { $('login').style.display = 'block'; $('app').style.display = $('nav').style.display = 'none'; }
function saveKey(e) { e.preventDefault(); KEY = $('key').value.trim(); store.set('grainKey', KEY); boot(); }

function openSheet(html) { $('sheetBody').innerHTML = html; $('mask').classList.add('show'); $('sheet').classList.add('show'); }
function closeSheet() { $('mask').classList.remove('show'); $('sheet').classList.remove('show'); }
function options(title, items, cur, cb) {
  window._pick = v => { closeSheet(); cb(v); };
  openSheet(`<h3>${title}</h3>` + items.map(([v, t]) => `<button class="opt ${v === cur ? 'on' : ''}" onclick="_pick('${esc(v)}')">${esc(t)}${v === cur ? '<span>✓</span>' : ''}</button>`).join(''));
}

/* ---------- 演示数据 (只在前端, 不写入后端) ---------- */
function demoSeries(n, start, drift, seed = 3) {
  let p = start, out = [], t = new Date(); t.setDate(t.getDate() - n + 1);
  for (let i = 0; i < n; i++) { const d = new Date(t); d.setDate(t.getDate() + i);
    p += drift + Math.sin(i * 1.7 + seed) * 0.006; out.push({ date: d.toISOString().slice(0, 10), price: +p.toFixed(3) }); }
  return out;
}
const DEMO = {
  market() { const h = demoSeries(S.days, S.crop === 'corn' ? 1.06 : 1.22, 0.0006);
    return { basis: '演示数据', price: h.at(-1).price, date: h.at(-1).date, change_1: 0.36, change_5: 1.12, change_20: 2.4, history: h,
      futures: [{ name: '大商所玉米主力', price: 2286, unit: '元/吨', change_1: 0.4 }, { name: '郑商所强麦主力', price: 2490, unit: '元/吨', change_1: -0.2 },
                { name: '美玉米CBOT', price: 421.5, unit: '美分/蒲式耳', change_1: 0.8 }, { name: '美小麦CBOT', price: 538.25, unit: '美分/蒲式耳', change_1: -0.5 }],
      weather: { city: S.region, precip_10d: 12.4, tmin: 6, tmax: 19 }, notes: [{ date: '2026-10-25', content: '深加工厂到货减少，提价1分' }] }; },
  analysis() { const h = demoSeries(6, 1.09, 0.004, S.horizon), last = h.at(-1).price, n = S.horizon;
    const path = Array.from({ length: n }, (_, i) => +(last + (i + 1) * 0.025 / n * 3 + Math.sin(i) * 0.003).toFixed(3));
    return { basis: '演示数据', history: h, analysis: { source: 'demo', stance: '震荡偏强', direction: 'up', base_date: h.at(-1).date, base_price: last,
      horizon_days: n, low: last - 0.01, high: last + 0.05, confidence: 0.62, path,
      factors: [{ type: 'plus', title: '企业到货减少', detail: '部分深加工企业到货量下降，收购积极性提升，对价格形成支撑。' },
                { type: 'minus', title: '新粮上市增加', detail: '新季玉米陆续上市，市场供应增加，对价格形成一定压力。' }],
      watch: '若企业连续降价，重新评估走势。' } }; },
  reviews() { const mk = (b, t, d1, p1, d2, p2, ok, rv) => ({ base_date: b, target_date: t, direction: d1, base_price: p1, actual_price: p2, crop: S.crop, region: S.region,
      status: p2 == null ? 'open' : 'done', correct: p2 == null ? null : ok, actual_change_pct: p2 == null ? null : +((p2 / p1 - 1) * 100).toFixed(2), review: rv, horizon_days: 7, factors: [], source: 'demo', d2 });
    const items = [mk('2026-10-20', '2026-10-27', 'up', 1.100, 'up', 1.125, 1), mk('2026-10-17', '2026-10-24', 'up', 1.140, 'down', 1.110, 0, '实际供应压力高于预期。'),
                   mk('2026-10-24', '2026-10-31', 'up', 1.118, null, null), mk('2026-10-25', '2026-10-28', 'flat', 1.121, null, null)];
    return { checked: 2, pending: 2, items, lessons: [{ content: '新粮集中上市期，即使企业提价，也要防范供应压力。', created_at: '2026-10-24' }] }; },
  status: { market: { ok: false }, deepseek: { ok: false }, auto: { ok: false } },
};

/* ---------- 页面切换 ---------- */
document.querySelectorAll('nav button').forEach(b => b.onclick = () => go(b.dataset.p));
function go(p) {
  S.page = p; store.set('page', p);
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x.dataset.p === p));
  document.querySelectorAll('.page').forEach(x => x.classList.toggle('on', x.id === 'p-' + p));
  window.scrollTo({ top: 0 }); render();
}
document.querySelectorAll('#hz button').forEach(b => b.onclick = () => {
  S.horizon = +b.dataset.h; document.querySelectorAll('#hz button').forEach(x => x.classList.toggle('on', x === b)); renderAnalysis();
});
document.querySelectorAll('#chips button').forEach(b => b.onclick = () => {
  S.filter = b.dataset.f; document.querySelectorAll('#chips button').forEach(x => x.classList.toggle('on', x === b)); drawReviews();
});
document.querySelectorAll('.modes button').forEach(b => b.onclick = () => { S.mode = b.dataset.m; store.set('mode', S.mode); renderChrome(); renderSettings(); });

function pickRegion(fromSettings) {
  options(`关注地区 · ${S.meta.province}`, S.meta.regions.map(r => [r, `${S.meta.province} · ${r}`]), S.region, v => { S.region = v; renderChrome(); render(); });
}
function pickCrop() { options('品种', Object.entries(CROP), S.crop, v => { S.crop = v; renderChrome(); render(); }); }
function pickUnit() { options('价格单位', [['jin', '元/斤'], ['ton', '元/吨']], S.unit, v => { S.unit = v; renderChrome(); render(); }); }

function renderChrome() {
  $('hRegion').textContent = `${S.meta.province} · ${S.region}`; $('hCrop').textContent = CROP[S.crop];
  document.querySelectorAll('.demoTag').forEach(t => t.style.display = isDemo() ? '' : 'none');
  $('genBtn').textContent = isDemo() ? '生成演示分析' : '生成分析';
  $('price').placeholder = `今日收购价（${unitTxt()}）`;
}
function render() { ({ market: renderMarket, analysis: renderAnalysis, review: renderReview, settings: renderSettings })[S.page]?.(); }

/* ---------- 图表 ---------- */
function lineChart(id, hist, path) {
  if (typeof Chart === 'undefined') return;
  charts[id]?.destroy();
  const green = css('--green2'), ctx = $(id).getContext('2d');
  const labels = hist.map(x => md(x.date)), n = hist.length;
  const fut = (path || []).map((p, i) => { const d = new Date(hist.at(-1).date); d.setDate(d.getDate() + i + 1); return [md(d.toISOString().slice(0, 10)), p]; });
  const g = ctx.createLinearGradient(0, 0, 0, 190); g.addColorStop(0, green + '38'); g.addColorStop(1, green + '00');
  const histData = hist.map(x => conv(x.price)).concat(fut.map(() => null));
  const futData = hist.map((_, i) => i === n - 1 ? conv(hist[i].price) : null).concat(fut.map(f => conv(f[1])));
  const divider = { id: 'divider', afterDatasetsDraw(c) { if (!fut.length) return; const x = c.scales.x.getPixelForValue(n - 1), a = c.chartArea;
    c.ctx.save(); c.ctx.setLineDash([3, 3]); c.ctx.strokeStyle = css('--mut2'); c.ctx.beginPath(); c.ctx.moveTo(x, a.top); c.ctx.lineTo(x, a.bottom); c.ctx.stroke(); c.ctx.restore(); } };
  charts[id] = new Chart(ctx, {
    type: 'line', plugins: [divider],
    data: { labels: labels.concat(fut.map(f => f[0])), datasets: [
      { data: histData, borderColor: green, backgroundColor: g, fill: true, tension: .25, pointRadius: 0, borderWidth: 2.5 },
      { data: futData, borderColor: green, borderDash: [5, 5], fill: false, tension: .25, borderWidth: 2.5,
        pointRadius: c => c.dataIndex === futData.length - 1 ? 3 : 0, pointBackgroundColor: green } ] },
    options: { maintainAspectRatio: false, animation: { duration: 400 }, interaction: { intersect: false, mode: 'index' },
      plugins: { legend: { display: false }, tooltip: { displayColors: false, cornerRadius: 10, filter: i => i.raw != null,
        callbacks: { label: i => `${fmt(S.unit === 'ton' ? i.raw / 2000 : i.raw)} ${unitTxt()}` } } },
      scales: { x: { grid: { display: false }, border: { display: false }, ticks: { maxTicksLimit: 5, color: css('--mut'), maxRotation: 0 } },
                y: { grid: { color: css('--line') }, border: { display: false }, ticks: { maxTicksLimit: 4, color: css('--mut'), callback: v => S.unit === 'ton' ? v.toFixed(0) : v.toFixed(2) } } } }
  });
}

/* ---------- 行情 ---------- */
async function renderMarket() {
  let m;
  try { m = isDemo() ? DEMO.market() : await api(`/api/market?region=${encodeURIComponent(S.region)}&crop=${S.crop}&days=${S.days}`); }
  catch (e) { $('priceCard').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  $('priceCard').innerHTML = !m.price ? '<div class="empty">正在采集行情，请稍后再来</div>' : `
    <div style="display:flex;justify-content:space-between;align-items:center"><span class="subtitle" style="margin:0">${S.region} · ${CROP[S.crop]}</span><span class="tag ${m.basis === '本地报价' ? '' : 'gray'}">${m.basis}</span></div>
    <div class="price" style="margin-top:6px">${fmt(m.price)}<small>${unitTxt()}</small></div>
    <div style="margin-top:6px;display:flex;gap:8px;align-items:center">${pill(m.change_1)}<span class="hint">周 ${m.change_5 ?? '—'}% · 月 ${m.change_20 ?? '—'}% · ${md(m.date)}</span></div>
    <div class="chartbox"><canvas id="mChart"></canvas></div>
    <div class="seg small" id="days">${[[30, '1月'], [90, '3月'], [365, '1年']].map(([d, t]) => `<button data-d="${d}" class="${d === S.days ? 'on' : ''}">${t}</button>`).join('')}</div>`;
  $('priceCard').querySelectorAll('#days button').forEach(b => b.onclick = () => { S.days = +b.dataset.d; renderMarket(); });
  if (m.history?.length) lineChart('mChart', m.history);
  $('futures').innerHTML = m.futures.map(f => `<div class="mini"><span>${esc(f.name)}</span><span>${f.price} <span class="hint">${f.unit}</span> ${pill(f.change_1)}</span></div>`).join('') || '<div class="hint">暂无</div>';
  $('notes').innerHTML = m.notes.map(n => `<div class="mini"><span>${esc(n.content)}</span><span class="hint">${md(n.date)}</span></div>`).join('');
  const w = m.weather;
  $('weatherCard').innerHTML = `<h4 style="margin-top:0">${S.region}天气 · 未来10天</h4>` + (w
    ? `<div class="mini"><span>气温</span><span>${w.tmin}° ~ ${w.tmax}°</span></div><div class="mini"><span>累计降水</span><span>${w.precip_10d} mm</span></div>`
    : '<div class="hint">暂无天气数据</div>');
}
async function addPrice(e) {
  e.preventDefault();
  if (isDemo()) return toast('演示模式不写入正式记录');
  let p = +$('price').value; if (S.unit === 'ton') p /= 2000;
  try { await api('/api/prices', { crop: S.crop, region: S.region, price: p }); $('price').value = ''; toast('已保存'); renderMarket(); } catch (err) { toast(err.message); }
}
async function addNote(e) {
  e.preventDefault();
  if (isDemo()) return toast('演示模式不写入正式记录');
  try { await api('/api/notes', { content: $('note').value, region: S.region }); $('note').value = ''; toast('已记下'); renderMarket(); } catch (err) { toast(err.message); }
}

/* ---------- 分析 ---------- */
function analysisHTML(r) {
  const a = r.analysis;
  if (!a) return `<div class="empty">还没有${S.region}${CROP[S.crop]}的${S.horizon}天分析<br>点下方「生成分析」</div>`;
  const cls = a.direction === 'up' ? '' : a.direction;
  const src = a.source === 'demo' ? '演示分析' : SRC[a.source] || a.source;
  return `<div class="headline"><b class="${cls}">未来${a.horizon_days}天 · ${esc(a.stance || DIR[a.direction])}</b><span class="tag">${src}</span></div>
    <div class="chartbox"><canvas id="aChart"></canvas></div>
    <div class="legend"><span><i></i>历史走势</span><span><i class="dash"></i>预测趋势</span>
      <span class="note">${a.source === 'demo' ? '示意趋势，非价格预测。' : `区间 ${fmt(a.low)}~${fmt(a.high)} · 把握 ${Math.round((a.confidence || 0) * 100)}%`}</span></div>
    <h4>判断依据</h4>
    ${(a.factors || []).map(f => `<div class="factor"><div class="dot ${f.type}">${f.type === 'plus' ? '+' : f.type === 'minus' ? '−' : '·'}</div>
      <div><b>${esc(f.title)}</b><p>${esc(f.detail)}</p></div></div>`).join('')}
    ${a.watch ? `<div class="warn"><span class="ic">!</span><span>需关注：${esc(a.watch)}</span></div>` : ''}
    <div class="hint" style="margin-top:12px">基准 ${md(a.base_date)} ${fmt(a.base_price)} ${unitTxt()} · 口径：${esc(r.basis)}</div>`;
}
async function renderAnalysis() {
  let r;
  try { r = isDemo() ? DEMO.analysis() : await api(`/api/analysis?region=${encodeURIComponent(S.region)}&crop=${S.crop}&horizon=${S.horizon}`); }
  catch (e) { $('analysisCard').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  $('analysisCard').innerHTML = analysisHTML(r);
  if (r.analysis && r.history?.length) lineChart('aChart', r.history, r.analysis.path);
}
async function genAnalysis() {
  if (isDemo()) { renderAnalysis(); return toast('演示数据，不写入正式记录'); }
  const b = $('genBtn'); b.disabled = true; b.textContent = '分析中，约半分钟…';
  try {
    const r = await api('/api/analysis', { region: S.region, crop: S.crop, horizon: S.horizon });
    $('analysisCard').innerHTML = analysisHTML(r);
    if (r.analysis && r.history?.length) lineChart('aChart', r.history, r.analysis.path);
    toast(r.analysis?.source === 'deepseek' ? 'DeepSeek 分析完成' : '已用统计模型分析');
  } catch (e) { toast(e.message); }
  b.disabled = false; renderChrome();
}

/* ---------- 复盘 ---------- */
async function renderReview() {
  try { S.reviews = isDemo() ? DEMO.reviews() : await api(`/api/reviews?region=${encodeURIComponent(S.region)}&crop=${S.crop}`); }
  catch (e) { $('reviewList').innerHTML = `<div class="card empty">${esc(e.message)}</div>`; return; }
  const r = S.reviews;
  $('stats').innerHTML = `<div><b>${r.checked}</b><span>已核验</span></div><div><b>${r.pending}</b><span>待核验</span></div>`;
  $('lessons').innerHTML = r.lessons.map(l => `<div class="mini"><span>${esc(l.content)}</span><span class="hint">${md(l.created_at)}</span></div>`).join('')
    || '<div class="hint">出现偏差后，AI 会自动总结经验，下次分析先参考。</div>';
  drawReviews();
}
function drawReviews() {
  const f = S.filter, items = S.reviews.items.filter(p => f === 'all' || (f === 'open' ? p.status === 'open' : p.status === 'done' && (f === 'ok' ? p.correct : !p.correct)));
  window._detail = i => showDetail(items[i]);
  $('reviewList').innerHTML = items.map((p, i) => {
    const done = p.status === 'done', ad = done ? (p.d2 || dirOf(p.actual_change_pct)) : null;
    const tag = !done ? '<span class="tag gray">待核验</span>' : p.correct ? '<span class="tag">判断一致</span>' : '<span class="tag orange">出现偏差</span>';
    return `<div class="card">
      <div class="rhead"><b>${md(p.base_date)} → ${md(p.target_date)}</b>${tag}</div>
      <div class="subtitle">${CROP[p.crop]} · ${S.meta.province}${esc(p.region)} · ${p.horizon_days}天</div>
      <div class="cmp">
        <div class="box"><div class="hint">初始预测</div><div class="dir ${p.direction}">${dirIcon(p.direction)}${esc(p.stance || DIR[p.direction])}</div>
          <div><b>${fmt(p.base_price)}</b> <span class="hint">${unitTxt()}</span></div><div class="hint">${md(p.base_date)}</div></div>
        <span class="arrow">→</span>
        <div class="box"><div class="hint">实际走势</div>${done ? `<div class="dir ${ad}">${dirIcon(ad)}${DIR[ad]}</div>
          <div><b>${fmt(p.actual_price)}</b> <span class="hint">${unitTxt()}</span></div><div class="hint">${md(p.target_date)}</div>`
          : `<div class="dir flat" style="font-size:16px;margin-top:8px">等待到期</div><div class="hint" style="margin-top:6px">${md(p.target_date)} 核验</div>`}</div>
      </div>
      ${done && !p.correct ? `<div class="reason"><div><div class="t">偏差原因</div><div class="v">${esc(p.review || 'AI 复盘中…')}</div></div><button class="more" onclick="_detail(${i})">查看复盘 ›</button></div>`
        : `<div style="text-align:right;margin-top:10px"><button class="more" onclick="_detail(${i})">查看详情 ›</button></div>`}
    </div>`;
  }).join('') || '<div class="card empty">暂无记录</div>';
}
function dirOf(pct) { return Math.abs(pct) < .5 ? 'flat' : pct > 0 ? 'up' : 'down'; }
function showDetail(p) {
  openSheet(`<h3>${md(p.base_date)} → ${md(p.target_date)} · ${CROP[p.crop]}</h3>
    <p>来源：${p.source === 'demo' ? '演示' : SRC[p.source] || p.source}${p.basis ? ' · 口径：' + esc(p.basis) : ''}</p>
    <p>预测：${esc(p.stance || DIR[p.direction])}${p.low != null ? `，区间 ${fmt(p.low)} ~ ${fmt(p.high)} ${unitTxt()}` : ''}</p>
    ${p.status === 'done' ? `<p>实际：${fmt(p.actual_price)} ${unitTxt()}（${p.actual_change_pct > 0 ? '+' : ''}${p.actual_change_pct}%）</p>` : ''}
    ${p.review ? `<div class="warn" style="margin:10px 0"><span class="ic">!</span><span>${esc(p.review)}</span></div>` : ''}
    ${(p.factors || []).length ? '<h4>当时的判断依据</h4>' + p.factors.map(f => `<div class="factor"><div class="dot ${f.type}">${f.type === 'plus' ? '+' : f.type === 'minus' ? '−' : '·'}</div><div><b>${esc(f.title)}</b><p>${esc(f.detail)}</p></div></div>`).join('') : ''}
    ${p.watch ? `<p>需关注：${esc(p.watch)}</p>` : ''}`);
}

/* ---------- 设置 ---------- */
async function renderSettings() {
  $('sRegion').textContent = `${S.meta.province} · ${S.region}`; $('sCrop').textContent = CROP[S.crop]; $('sUnit').textContent = unitTxt();
  document.querySelectorAll('.modes button').forEach(b => { const on = b.dataset.m === S.mode; b.classList.toggle('on', on);
    b.innerHTML = (on ? '<span class="badge-ok" style="background:#fff;color:var(--green)">✓</span>' : '') + (b.dataset.m === 'demo' ? '预览演示' : '真实数据'); });
  try { S.status = await api('/api/status'); } catch (e) { S.status = null; }
  const s = S.status || DEMO.status;
  const st = (ok, yes, no) => `<span class="${ok ? 'badge-ok' : 'badge-no'}">${ok ? '✓' : '!'}</span>${ok ? yes : no}`;
  const row = (icon, k, v, fn) => `<button class="row" onclick="${fn}">${icon}<span class="k">${k}</span><span class="v">${v}</span><span class="gt">›</span></button>`;
  const I = p => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  $('statusList').innerHTML = `<div class="row">${I('<path d="M10 14a5 5 0 007 0l3-3a5 5 0 00-7-7l-1 1"/><path d="M14 10a5 5 0 00-7 0l-3 3a5 5 0 007 7l1-1"/>')}<span class="k">接入状态</span><span class="v">由后端配置</span></div>`
    + row(I('<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>'), '行情来源', st(s.market.ok, '已接入', '未配置'), "statusInfo('market')")
    + row(I('<path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 22V12M21 7l-9 5-9-5"/>'), 'DeepSeek', st(s.deepseek.ok, '已接入', '未配置'), "statusInfo('deepseek')")
    + row(I('<path d="M6 20v-6M12 20V8M18 20V4"/>'), '自动分析', st(s.auto.ok, '已开启', '未开启'), "statusInfo('auto')")
    + row(I('<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>'), '接入说明', '', "statusInfo('help')");
}
function statusInfo(k) {
  const s = S.status || DEMO.status;
  const html = {
    market: `<h3>行情来源</h3><p>期货：新浪财经日线（大商所玉米、郑商所强麦、CBOT），每天 7:40 / 15:40 / 23:40 自动采集。</p><p>天气：Open-Meteo。本地收购价：在「行情」页手动记录，近60天记满 ${s.market.local_min || 20} 条后分析自动改用本地价。</p>
      <p>最新数据：${s.market.last_date || '暂无'}${s.market.last_fetch ? '，上次采集 ' + s.market.last_fetch.time.replace('T', ' ') : ''}</p>`,
    deepseek: `<h3>DeepSeek</h3><p>${s.deepseek.ok ? '已接入，模型：' + esc(s.deepseek.model) : '未配置。在服务器 .env 中填写 <code>DEEPSEEK_API_KEY</code> 后重启。'}</p>
      <p>未配置或调用失败时，自动使用统计模型分析。</p>${s.deepseek.last_error ? `<p>最近一次失败：${esc(s.deepseek.last_error.time)} ${esc(s.deepseek.last_error.error)}</p>` : ''}`,
    auto: `<h3>自动分析</h3><p>${s.auto.ok ? `已开启，每天 ${s.auto.time} 自动：核验到期预测 → AI 复盘偏差、总结经验 → 按你保存的关注地区生成玉米、小麦 3天/7天分析。` : '未开启。在 .env 中设置 <code>AUTO_ANALYSIS=1</code> 后重启。'}</p>
      <p>上次运行：${s.auto.last_run ? s.auto.last_run.replace('T', ' ') : '暂无'}</p>`,
    help: `<h3>接入说明</h3><p>所有接入都在服务器上配置，网页不保存任何密钥。</p>
      <p>1. SSH 登录 VPS，进入 <code>xiao/grain</code></p><p>2. <code>nano .env</code> 填写：</p>
      <p><code>DEEPSEEK_API_KEY=sk-...</code><br><code>AUTO_ANALYSIS=1</code><br><code>AUTO_ANALYSIS_TIME=16:10</code></p>
      <p>3. <code>docker compose up -d</code> 重启生效</p>`,
  }[k];
  openSheet(html);
}
async function savePrefs() {
  try { await api('/api/prefs', { region: S.region, crop: S.crop, unit: S.unit }); toast('偏好已保存，自动分析将按此地区运行'); }
  catch (e) { toast(e.message); }
}

/* ---------- 启动 ---------- */
async function boot() {
  try { S.meta = await api('/api/meta'); } catch (e) { if (e.message !== '密钥错误') toast(e.message); return showLogin(); }
  Object.assign(S, { region: S.meta.prefs.region, crop: S.meta.prefs.crop, unit: S.meta.prefs.unit });
  $('login').style.display = 'none'; $('app').style.display = 'block'; $('nav').style.display = 'flex';
  renderChrome(); go(S.page);
}
KEY ? boot() : showLogin();
</script>
</body>
</html>
