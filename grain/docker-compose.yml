services:
  app:
    build: .
    restart: always
    env_file: .env
    volumes:
      - ./data:/data
    # 不用域名时直接访问 http://VPS的IP:端口
    ports: ["${APP_PORT:-8080}:8000"]
  # 可选: 填了 DOMAIN 时由 Caddy 自动配置 https (deploy.sh 会自动启用)
  caddy:
    image: caddy:2
    restart: always
    profiles: ["https"]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
volumes:
  caddy_data:
